name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Production dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          # Dummy values: the build only needs these to be present, not valid.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          OPENAI_API_KEY: sk-dummy
